services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_local_only
      POSTGRES_DB: isp_efficiency
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - isp_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
volumes:
  isp_pgdata:
