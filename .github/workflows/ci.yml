name: MVP CI
on:
  push:
    branches: [main, feat/mvp-foundation]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test -w @isp/api
      - run: npm run build -w @isp/api
      - run: npm run build -w @isp/web
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://isp:dummy@localhost:5432/isp_efficiency
