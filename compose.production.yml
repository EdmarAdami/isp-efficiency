name: isp-efficiency
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: isp
      POSTGRES_DB: isp_efficiency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U isp -d isp_efficiency']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://isp:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/isp_efficiency?schema=public
      API_TENANT_ID: ${API_TENANT_ID:?Configure API_TENANT_ID}
      TENANT_NAME: ${TENANT_NAME:-Provedor local}
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://isp:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/isp_efficiency?schema=public
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?Configure API_SERVICE_TOKEN}
      API_TENANT_ID: ${API_TENANT_ID:?Configure API_TENANT_ID}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      REDIS_URL: redis://redis:6379
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Configure AUTH_SECRET}
      AUTH_URL: http://localhost:${WEB_PORT:-3000}
      AUTH_TRUST_HOST: 'true'
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID:-}
      ISP_ALLOWED_EMAILS: ${ISP_ALLOWED_EMAILS:-}
      ISP_API_INTERNAL_URL: http://api:3001
      ISP_API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?Configure API_SERVICE_TOKEN}
    networks: [backend, frontend]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
networks:
  backend:
    internal: true
  frontend:
volumes:
  pgdata:
  redisdata:
